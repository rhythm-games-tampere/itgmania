on:
  push:
    paths:
      - 'src/**'
      - 'Data/**'
      - 'Themes/_fallback/**'
      - 'NoteSkins/**'
      - 'Utils/RenderTest/**'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'CMakePresets.json'
      - '.github/workflows/rendertest.yml'
      - '.github/actions/setup-env/**'
  pull_request:
    paths:
      - 'src/**'
      - 'Data/**'
      - 'Themes/_fallback/**'
      - 'NoteSkins/**'
      - 'Utils/RenderTest/**'
      - '**/CMakeLists.txt'
      - '**.cmake'
      - 'CMakePresets.json'
      - '.github/workflows/rendertest.yml'
      - '.github/actions/setup-env/**'
  workflow_dispatch:

name: Render test

permissions:
  contents: read
  actions: read  # to download the previous run's screenshots

# Runs Utils/RenderTest on software OpenGL (Mesa llvmpipe on Linux and
# Windows, Apple's GL on macOS). Fails if the game crashes or doesn't finish
# every step; pixel differences against the last successful run on the same
# platform are reported in the job summary, not failed on, since rendering
# work changes pixels on purpose.
jobs:
  rendertest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux
          - os: macos-15
            name: macOS
          - os: windows-2022
            name: Windows
    name: ${{ matrix.name }}
    env:
      ARTIFACT: rendertest-${{ matrix.os }}
      # Mesa: llvmpipe is deterministic; its D3D12 backend crashes the game.
      GALLIUM_DRIVER: llvmpipe
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        uses: ./.github/actions/setup-env
        with:
          os: ${{ matrix.os }}
          ccache: 'true'
          mesa: 'true'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Configure
        run: cmake --preset ${{ env.PRESET }}
      - name: Build
        run: cmake --build --preset ${{ env.PRESET }}

      - name: Run with the platform window
        shell: bash
        run: |
          # Runner desktops are about 1024x768, and perf numbers from software
          # renderers mean nothing.
          cmd="python Utils/RenderTest/rendertest.py run --out rendertest-out --timeout 1500 --size 960x540 --no-perf --pref WindowDriver=Native"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi

      - name: Run with power-of-two textures
        shell: bash
        run: |
          cmd="python Utils/RenderTest/rendertest.py run --out rendertest-pot --timeout 1500 --size 960x540 --no-perf --pref WindowDriver=Native --pref NonPowerOfTwoTextures=0"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi
          {
            echo "### ${{ matrix.name }}: non-power-of-two textures vs. padded"
            echo '```'
            python Utils/RenderTest/rendertest.py compare rendertest-pot rendertest-out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run with the SDL window
        shell: bash
        run: |
          # This run also plays the profiled song in RenderProfiler mode 3
          # (GPU timer queries, spike records) with the KHR_debug callback on,
          # so those paths run on every platform. The numbers themselves mean
          # nothing on software renderers.
          cmd="python Utils/RenderTest/rendertest.py run --out rendertest-sdl --timeout 1500 --size 960x540 --profiler-mode 3 --pref GLDebug=1 --pref WindowDriver=SDL"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" $cmd
          else
            $cmd
          fi
          {
            echo "### ${{ matrix.name }}: SDL window vs. platform window"
            echo '```'
            python Utils/RenderTest/rendertest.py compare rendertest-out rendertest-sdl || true
            echo '```'
            echo "### ${{ matrix.name }}: RenderProfiler mode 3"
            echo '```'
            sed -n '/=== Frames/,/^Note/p;/=== Spikes/,$p' rendertest-sdl/perf.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # The report must have the GPU timers and the spike summary, and the
          # debug callback must not have seen GL errors.
          python - <<'EOF'
          import json, sys
          perf = json.load(open("rendertest-sdl/perf.json"))
          missing = [k for k in ("gpu_ms", "swap_ms", "finish_ms", "spikes") if k not in perf]
          errors = [l for l in open("rendertest-sdl/log.txt", errors="replace")
                    if "GL error" in l]
          print("missing from perf.json:", missing or "nothing")
          print("".join(errors[:20]) or "no GL errors")
          sys.exit(1 if missing or errors else 0)
          EOF

      - name: Compare with the last successful run
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=""
          for branch in "${{ github.head_ref || github.ref_name }}" "${{ github.event.repository.default_branch }}"; do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rendertest.yml --branch "$branch" \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$id" ] && break
          done
          if [ -z "$id" ] || ! gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D baseline; then
            echo "No earlier successful run to compare with." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### ${{ matrix.name }}: compared with run $id"
            echo '```'
            python Utils/RenderTest/rendertest.py compare baseline rendertest-out || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: rendertest-out
      - name: Upload SDL window results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-sdl
          path: rendertest-sdl
      - name: Upload power-of-two results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-pot
          path: rendertest-pot
