on:
  push:
    branches:
      - beta
      - release
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        type: choice
        options:
          - nightly
          - full
        default: nightly
      os:
        description: 'OS / architecture'
        type: choice
        options:
          - all
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
          - windows-2022
        default: all
      club_fantastic:
        description: 'Include Club Fantastic songs'
        type: choice
        options:
          - 'Off'
          - 'On'
          - Both
        default: 'Off'

name: Release

jobs:
  # On push: build all OSes. On manual dispatch: build only the selected OS
  # (or all). The matrix context isn't available in a job-level `if:`, so we
  # compute the matrix here and feed it to the build job via fromJSON.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Compute build matrix
        id: set-matrix
        shell: bash
        run: |
          oses='[
            {"os":"ubuntu-24.04","name":"Ubuntu (x86_64)"},
            {"os":"ubuntu-24.04-arm","name":"Ubuntu (ARM)"},
            {"os":"macos-15","name":"macOS (M1)"},
            {"os":"macos-15-intel","name":"macOS (Intel)"},
            {"os":"windows-2022","name":"Windows"}
          ]'
          os_sel='${{ github.event.inputs.os }}'
          cf_sel='${{ github.event.inputs.club_fantastic }}'

          # Filter OSes: empty (push) or "all" => every OS; otherwise just the picked one.
          if [ -z "$os_sel" ] || [ "$os_sel" = "all" ]; then
            os_list="$oses"
          else
            os_list="$(jq -c --arg os "$os_sel" '[.[] | select(.os == $os)]' <<< "$oses")"
          fi

          # Club Fantastic values: empty (push) or "Off" => Off only; "On" => On; "Both" => both.
          case "$cf_sel" in
            On)   cf='["On"]' ;;
            Both) cf='["Off","On"]' ;;
            *)    cf='["Off"]' ;;
          esac

          # Cross-product OS x Club Fantastic into the matrix include list.
          include="$(jq -c --argjson cf "$cf" \
            '[ .[] as $o | $cf[] | {os: $o.os, name: $o.name, club_fantastic: .} ]' <<< "$os_list")"
          echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    name: "${{ matrix.name }} - ClubFantastic: ${{ matrix.club_fantastic }}"

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: ./.github/actions/setup-env
        with:
          os: ${{ matrix.os }}
          ccache: 'false'

      - name: Create nightly release
        if: (github.event_name == 'push' && github.ref_name == 'beta') || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'nightly')
        run: >
          cmake --preset ${{ env.PRESET }}
          -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On
          -DWITH_CLUB_FANTASTIC=${{ matrix.club_fantastic }}

      - name: Create full release
        if: (github.event_name == 'push' && github.ref_name == 'release') || (github.event_name == 'workflow_dispatch' && inputs.release_type == 'full')
        run: >
          cmake --preset ${{ env.PRESET }}
          -DWITH_FULL_RELEASE=On -DWITH_NIGHTLY_RELEASE=Off
          -DWITH_CLUB_FANTASTIC=${{ matrix.club_fantastic }}

      - name: Create package
        run: cmake --build --preset ${{ env.PRESET }} --target package

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.os }}-ClubFantastic-${{ matrix.club_fantastic }}
          path: ${{ env.ARTIFACT_PATH }}
          archive: true

      - uses: actions/attest@v4
        with:
          subject-name: ITGmania-${{ github.sha }}-${{ matrix.os }}-ClubFantastic-${{ matrix.club_fantastic }}
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
