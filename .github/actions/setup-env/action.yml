name: "Setup Build Environment"
description: "Installs dependencies required to build ITGmania based on the runner's operating system."
inputs:
  os:
    description: "The OS name from the matrix (e.g., ubuntu-24.04, macos-15, windows-2022)"
    required: true
  ccache:
    description: "Whether to install ccache"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libgl-dev libgtk-3-dev libjack-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm libwayland-dev libxkbcommon-dev libegl-dev libdecor-0-dev libxi-dev libxcursor-dev libxfixes-dev ninja-build
        if [ "${{ inputs.ccache }}" = "true" ]; then
          sudo apt-get install -y ccache
        fi
      shell: bash

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install nasm ninja
        if [ "${{ inputs.ccache }}" = "true" ]; then
          brew install ccache
        fi
      shell: bash

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      run: |
        if [ "${{ inputs.ccache }}" = "true" ]; then
          choco install ccache
        fi
      shell: bash

    - name: ccache
      if: inputs.ccache == 'true'
      uses: actions/cache@v5
      with:
        path: .ccache
        key: ${{ inputs.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ inputs.os }}-ccache-${{ github.ref }}-
          ${{ inputs.os }}-ccache-

    - name: Set ccache environment
      if: inputs.ccache == 'true'
      run: |
        mkdir -p .ccache
        echo "CCACHE_DIR=${{ github.workspace }}/.ccache" >> $GITHUB_ENV
        echo "CCACHE_BASEDIR=${{ github.workspace }}" >> $GITHUB_ENV
      shell: bash

    # Ninja on Windows needs the MSVC environment (cl, link, rc on PATH):
    # run vcvars64.bat and hand every variable it changes to later steps.
    - name: Set up MSVC environment
      if: runner.os == 'Windows'
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "No Visual Studio with the x64 C++ tools found" }
        $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
        $vars = cmd /c "`"$vcvars`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
        foreach ($line in $vars) {
          $name, $value = $line -split '=', 2
          if ($name -and $value -and [Environment]::GetEnvironmentVariable($name) -ne $value) {
            "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
        }
      shell: pwsh

    # PRESET names the CMakePresets.json configure and build preset; the ci-
    # variants add ccache. Packages land in Build/<preset>.
    - name: Pick the CMake preset
      run: |
        case "${{ inputs.os }}" in
          ubuntu-*)        preset=linux ;;
          macos-15-intel)  preset=macos-x64 ;;
          macos-*)         preset=macos-arm64 ;;
          windows-*)       preset=windows ;;
        esac
        if [ "${{ inputs.ccache }}" = "true" ]; then
          preset="ci-$preset"
        fi
        case "$preset" in
          *linux)   ext=.tar.gz ;;
          *macos-*) ext=.dmg ;;
          *)        ext= ;;
        esac
        echo "PRESET=$preset" >> "$GITHUB_ENV"
        echo "ARTIFACT_PATH=Build/$preset/ITGmania-*$ext" >> "$GITHUB_ENV"
      shell: bash
